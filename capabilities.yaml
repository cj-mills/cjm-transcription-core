  env_file: https://raw.githubusercontent.com/cj-mills/cjm-capability-monitor-nvidia/main/environment.yml
  package: cjm-capability-monitor-nvidia>=0.0.25
  interface_libs:
  - cjm-capability-primitives>=0.0.12
- name: ffmpeg
