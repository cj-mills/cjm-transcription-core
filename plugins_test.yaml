plugins:
  # ----------------------------------------------------------------
  # Infrastructure Worker: NVIDIA Monitor
  # GPU subtree attribution for empirical resource tracking (CR-7).
  # Load FIRST (before GPU transcribers) so their samples record
  # gpu_memory_mb_peak — scale evidence from the Supernova runs.
  # ----------------------------------------------------------------
  - name: sys-mon-nvidia
    env_name: test-sys-mon

    # Environment File
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-system-monitor-nvidia/environment.yml"

    # The Plugin Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-system-monitor-nvidia/"

    # Interface Libraries
    interface_libs:
      # schema v2: substrate AUTO-INJECTED; the monitor depends only on the telemetry
      # data nouns (cjm-capability-primitives), not the dissolved cjm-infra-plugin-system.
      # NO adapters block -- consumed via the native-dispatch channel
      # (get_system_status / list_processes), not a task.
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-primitives/"

  # ----------------------------------------------------------------
  # Media Processing: FFmpeg
  # Convert (model-input prep) + segment_audio (boundary cuts).
  # Local source paths for fast iteration (everything in-tree).
  # ----------------------------------------------------------------
  - name: ffmpeg
    env_name: test-ffmpeg

    # Environment File
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-media-plugin-ffmpeg/environment.yml"

    # The Plugin Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-media-plugin-ffmpeg/"

    # Interface Libraries (schema v2: substrate AUTO-INJECTED; the tool depends
    # only on the result data nouns, not the old media domain interface lib)
    interface_libs:
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-primitives/"

    # Adapter impls this worker env carries (the generic multi-method media-processing
    # adapter; auto-binds to ffmpeg via surface match: convert/segment_audio/extract_audio/get_info)
    adapters:
      - lib: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-media-processing-adapter-interface/"
        impl: "cjm_media_processing_adapter_interface.generic:GenericMediaProcessingAdapter"

  # ----------------------------------------------------------------
  # Media Analysis: Silero VAD
  # CPU-based speech detection (bundled wheel weights)
  # ----------------------------------------------------------------
  - name: silero-vad
    env_name: test-silero-vad

    # Environment File
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-media-plugin-silero-vad/environment.yml"

    # The Plugin Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-media-plugin-silero-vad/"

    # Interface Libraries (schema v2: substrate AUTO-INJECTED; the tool depends
    # only on the result data noun, not the old media domain interface lib)
    interface_libs:
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-primitives/"

    # Adapter impls this worker env carries (the generic VAD adapter; auto-binds
    # to silero-vad via surface match: detect_speech + get_current_config)
    adapters:
      - lib: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-vad-adapter-interface/"
        impl: "cjm_vad_adapter_interface.generic:GenericVADAdapter"

  # ----------------------------------------------------------------
  # Media Preprocessing: Demucs (source separation / vocals isolation)
  # Stage 8 (Option C): OPT-IN transcription-core preprocessing — runs
  # per-segment on FULL-BAND audio BEFORE the model-input convert
  # (vocals -> convert -> transcribe / decomp VAD+FA). Select via
  #   cjm-transcription-core run --preprocessing-plugin cjm-media-plugin-demucs
  # ----------------------------------------------------------------
  - name: demucs
    env_name: test-demucs

    # Environment File
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-media-plugin-demucs/environment.yml"

    # The Plugin Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-media-plugin-demucs/"

    # Interface Libraries (schema v2: substrate AUTO-INJECTED; the tool depends
    # only on the result data noun, not the old media domain interface lib)
    interface_libs:
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-primitives/"

    # Adapter impls this worker env carries (the generic source-separation
    # adapter; auto-binds to demucs via surface match: separate_vocals + get_current_config)
    adapters:
      - lib: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-source-separation-adapter-interface/"
        impl: "cjm_source_separation_adapter_interface.generic:GenericSourceSeparationAdapter"

  # ----------------------------------------------------------------
  # AI Worker: Whisper
  # Default transcriber for the minimal pipeline (lightest local model;
  # quick-iteration tier)
  # ----------------------------------------------------------------
  - name: whisper-local
    env_name: test-whisper

    # Environment File (System Deps)
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-transcription-plugin-whisper/environment.yml"

    # The Plugin Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-transcription-plugin-whisper/"

    # Interface Libraries (schema v2: substrate AUTO-INJECTED; the tool
    # depends only on the result data noun, not the old domain interface lib)
    interface_libs:
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-primitives/"

    # Adapter impls this worker env carries (the generic transcription
    # adapter; auto-binds to whisper via surface match: transcribe + get_current_config)
    adapters:
      - lib: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-transcription-adapter-interface/"
        impl: "cjm_transcription_adapter_interface.generic:GenericTranscriptionAdapter"

  # ----------------------------------------------------------------
  # AI Worker: Voxtral HF (Voxtral-Mini-3B-2507)
  # Higher-quality transcriber — select via
  #   cjm-transcription-core run --transcriber cjm-transcription-plugin-voxtral-hf
  # Preferred for the design-guiding corpus tier (Supernova I/II).
  # ----------------------------------------------------------------
  - name: voxtral-hf
    env_name: test-voxtral-hf

    # Environment File (System Deps)
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-transcription-plugin-voxtral-hf/environment.yml"

    # The Plugin Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-transcription-plugin-voxtral-hf/"

    # Interface Libraries (schema v2: substrate AUTO-INJECTED; the tool
    # depends only on the result data noun, not the old domain interface lib)
    interface_libs:
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-primitives/"

    # Adapter impls this worker env carries (the generic transcription
    # adapter; auto-binds to voxtral via surface match: transcribe + get_current_config)
    adapters:
      - lib: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-transcription-adapter-interface/"
        impl: "cjm_transcription_adapter_interface.generic:GenericTranscriptionAdapter"

  # ----------------------------------------------------------------
  # Context Graph: SQLite Graph
  # Stage 5 (CR-18 revolution 2): transcription EMITS the graph root
  # (Source -> AudioSegment -> Transcript) through this capability's
  # graph-storage adapter via the task channel.
  # ----------------------------------------------------------------
  - name: sqlite-graph
    env_name: test-sqlite-graph

    # Environment File
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-graph-plugin-sqlite/environment.yml"

    # The Plugin Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-graph-plugin-sqlite/"

    # Interface Libraries (schema v2: substrate AUTO-INJECTED; the tool depends
    # only on the graph data nouns, not the dissolved graph domain interface lib)
    interface_libs:
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-context-graph-primitives/"
    # Adapter impls this worker env carries (stage-6 J10: install-all
    # pip-installs `lib` into the env + generates the adapter manifest --
    # the I6/J8 manual steps now ride the pipeline)
    adapters:
      - lib: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-graph-storage-adapter-interface/"
        impl: "cjm_graph_storage_adapter_interface.generic:GenericGraphStorageAdapter"
