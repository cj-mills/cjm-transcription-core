capabilities:
  # ----------------------------------------------------------------
  # Infrastructure Worker: NVIDIA Monitor
  # GPU subtree attribution for empirical resource tracking (CR-7).
  # Load FIRST (before GPU transcribers) so their samples record
  # gpu_memory_mb_peak — scale evidence from the Supernova runs.
  # ----------------------------------------------------------------
  - name: sys-mon-nvidia
    env_name: test-sys-mon

    # Environment File
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-monitor-nvidia/environment.yml"

    # The Capability Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-monitor-nvidia/"

    # Interface Libraries
    interface_libs:
      # schema v2: substrate AUTO-INJECTED; the monitor depends only on the telemetry
      # data nouns (cjm-capability-primitives), not the dissolved cjm-infra-plugin-system.
      # NO adapters block -- consumed via the native-dispatch channel
      # (get_system_status / list_processes), not a task.
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-primitives/"

  # ----------------------------------------------------------------
  # Media Processing: FFmpeg
  # Convert (model-input prep) + segment_audio (boundary cuts).
  # Local source paths for fast iteration (everything in-tree).
  # ----------------------------------------------------------------
  - name: ffmpeg
    env_name: test-ffmpeg

    # Environment File
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-ffmpeg/environment.yml"

    # The Capability Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-ffmpeg/"

    # Interface Libraries (schema v2: substrate AUTO-INJECTED; the tool depends
    # only on the result data nouns, not the old media domain interface lib)
    interface_libs:
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-primitives/"

    # Adapter impls this worker env carries (the generic multi-method media-processing
    # adapter; auto-binds to ffmpeg via surface match: convert/segment_audio/extract_audio/get_info)
    adapters:
      - lib: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-media-processing-adapter-interface/"
        impl: "cjm_media_processing_adapter_interface.generic:GenericMediaProcessingAdapter"

  # ----------------------------------------------------------------
  # Media Analysis: Silero VAD
  # CPU-based speech detection (bundled wheel weights)
  # ----------------------------------------------------------------
  - name: silero-vad
    env_name: test-silero-vad

    # Environment File
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-silero-vad/environment.yml"

    # The Capability Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-silero-vad/"

    # Interface Libraries (schema v2: substrate AUTO-INJECTED; the tool depends
    # only on the result data noun, not the old media domain interface lib)
    interface_libs:
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-primitives/"

    # Adapter impls this worker env carries (the generic VAD adapter; auto-binds
    # to silero-vad via surface match: detect_speech + get_current_config)
    adapters:
      - lib: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-vad-adapter-interface/"
        impl: "cjm_vad_adapter_interface.generic:GenericVADAdapter"

  # ----------------------------------------------------------------
  # Media Preprocessing: Demucs (source separation / vocals isolation)
  # Stage 8 (Option C): OPT-IN transcription-core preprocessing — runs
  # per-segment on FULL-BAND audio BEFORE the model-input convert
  # (vocals -> convert -> transcribe / decomp VAD+FA). Select via
  #   cjm-transcription-core run --preprocessing-capability cjm-capability-demucs
  # ----------------------------------------------------------------
  - name: demucs
    env_name: test-demucs

    # Environment File
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-demucs/environment.yml"

    # The Capability Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-demucs/"

    # Interface Libraries (schema v2: substrate AUTO-INJECTED; the tool depends
    # only on the result data noun, not the old media domain interface lib)
    interface_libs:
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-primitives/"

    # Adapter impls this worker env carries (the generic source-separation
    # adapter; auto-binds to demucs via surface match: separate_vocals + get_current_config)
    adapters:
      - lib: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-source-separation-adapter-interface/"
        impl: "cjm_source_separation_adapter_interface.generic:GenericSourceSeparationAdapter"

  # ----------------------------------------------------------------
  # AI Worker: Whisper
  # Default transcriber for the minimal pipeline (lightest local model;
  # quick-iteration tier)
  # ----------------------------------------------------------------
  - name: whisper-local
    env_name: test-whisper

    # Environment File (System Deps)
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-whisper/environment.yml"

    # The Capability Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-whisper/"

    # Interface Libraries (schema v2: substrate AUTO-INJECTED; the tool
    # depends only on the result data noun, not the old domain interface lib)
    interface_libs:
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-primitives/"

    # Adapter impls this worker env carries (the generic transcription
    # adapter; auto-binds to whisper via surface match: transcribe + get_current_config)
    adapters:
      - lib: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-transcription-adapter-interface/"
        impl: "cjm_transcription_adapter_interface.generic:GenericTranscriptionAdapter"

  # ----------------------------------------------------------------
  # AI Worker: Voxtral HF (Voxtral-Mini-3B-2507)
  # Higher-quality transcriber — select via
  #   cjm-transcription-core run --transcriber cjm-capability-voxtral-hf
  # Preferred for the design-guiding corpus tier (Supernova I/II).
  # ----------------------------------------------------------------
  - name: voxtral-hf
    env_name: test-voxtral-hf

    # Environment File (System Deps)
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-voxtral-hf/environment.yml"

    # The Capability Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-voxtral-hf/"

    # Interface Libraries (schema v2: substrate AUTO-INJECTED; the tool
    # depends only on the result data noun, not the old domain interface lib)
    interface_libs:
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-primitives/"

    # Adapter impls this worker env carries (the generic transcription
    # adapter; auto-binds to voxtral via surface match: transcribe + get_current_config)
    adapters:
      - lib: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-transcription-adapter-interface/"
        impl: "cjm_transcription_adapter_interface.generic:GenericTranscriptionAdapter"

  # ----------------------------------------------------------------
  # AI Worker: Qwen3 Forced Aligner (Qwen3-ForcedAligner-0.6B)
  # Word-level audio-text alignment per ~5-minute pipeline segment
  # (300s is the model's recommended upper limit for optimal performance).
  # GPU; model downloads on first run.
  # 14b5b05a: consolidated into the WORKSPACE capabilities config — the
  # decomp stages resolve manifests from the workspace manifests dir, so
  # the workspace carries the UNION of pipeline capabilities.
  # ----------------------------------------------------------------
  - name: qwen3-forced-aligner
    env_name: test-qwen3-fa

    # Environment File (System Deps)
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-qwen3-forced-aligner/environment.yml"

    # The Capability Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-qwen3-forced-aligner/"

    # Interface Libraries (schema v2: substrate AUTO-INJECTED; the tool depends
    # only on the result data noun, not the old forced-alignment domain interface lib)
    interface_libs:
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-primitives/"

    # Adapter impls this worker env carries (the generic FA adapter; auto-binds
    # to qwen3-forced-aligner via surface match: align + get_current_config)
    adapters:
      - lib: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-forced-alignment-adapter-interface/"
        impl: "cjm_forced_alignment_adapter_interface.generic:GenericForcedAlignmentAdapter"

  # ----------------------------------------------------------------
  # Context Graph: SQLite Graph
  # Stage 5 (CR-18 revolution 2): transcription EMITS the graph root
  # (Source -> AudioSegment -> Transcript) through this capability's
  # graph-storage adapter via the task channel.
  # ----------------------------------------------------------------
  - name: sqlite-graph
    env_name: test-sqlite-graph

    # Environment File
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-graph-sqlite/environment.yml"

    # The Capability Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-graph-sqlite/"

    # Interface Libraries (schema v2: substrate AUTO-INJECTED; the tool depends
    # only on the graph data nouns, not the dissolved graph domain interface lib)
    interface_libs:
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-context-graph-primitives/"
    # Adapter impls this worker env carries (stage-6 J10: install-all
    # pip-installs `lib` into the env + generates the adapter manifest --
    # the I6/J8 manual steps now ride the pipeline)
    adapters:
      - lib: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-graph-storage-adapter-interface/"
        impl: "cjm_graph_storage_adapter_interface.generic:GenericGraphStorageAdapter"

  # ----------------------------------------------------------------
  # Media Analysis: pyannote speaker diarization (community-1)
  # Anonymous time-ranged speaker turns BESIDE transcription — the
  # silero-vad family shape (analysis, NOT preprocessing; a9cadfec).
  # HF-GATED model: accept pyannote/speaker-diarization-community-1
  # user conditions + provision a token (hf auth login / HF_TOKEN).
  # Identity stays the correction TUI's assignment lane (DEC 44afb2df).
  # ----------------------------------------------------------------
  - name: pyannote
    env_name: test-pyannote

    # Environment File
    env_file: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-pyannote/environment.yml"

    # The Capability Package (local source)
    package: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-pyannote/"

    # Interface Libraries (schema v2: substrate AUTO-INJECTED; the tool depends
    # only on the result data noun)
    interface_libs:
      - "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-capability-primitives/"

    # Adapter impls this worker env carries (the generic diarization adapter;
    # auto-binds to pyannote via surface match: diarize + get_current_config)
    adapters:
      - lib: "/mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills/cjm-speaker-diarization-adapter-interface/"
        impl: "cjm_speaker_diarization_adapter_interface.generic:GenericSpeakerDiarizationAdapter"
      # Capability-internal task adapters (DECs 1cfe6d0f / c0378082): propose +
      # finetune ride the task channel from the capability package itself —
      # impl-only entries, nothing extra to install.
      - impl: "cjm_capability_pyannote.propose:PyannoteAudioEventDetectionAdapter"
      - impl: "cjm_capability_pyannote.finetune:PyannoteSegmentationFinetuneAdapter"
